[project]
name = "llm-harness"
version = "0.1.0"
description = "LLM harness: streaming chat over Ollama, OpenAI-compatible and Vertex AI providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "nh3>=0.3.7",
    "nicegui>=3.18.0",
    "ollama>=0.6.3",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
    "qdrant-edge-py>=0.9.0",
    "textual>=8.2.8",
]

[project.scripts]
llm-harness = "llm_harness.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
addopts = '-m "not live" -p nicegui.testing.user_plugin'
main_file = ""
markers = ["live: calls a real model provider; run with -m live"]
asyncio_mode = "auto"
testpaths = ["tests"]
